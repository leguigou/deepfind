# Apache 2.4 + PHP-FPM 8.5 — /etc/apache2/sites-available/deepfind.conf
# Modules : a2enmod proxy_fcgi setenvif headers deflate expires http2 ssl ; a2enconf php8.5-fpm
# Recommandé : MPM event (a2dismod php8.5 mpm_prefork ; a2enmod mpm_event) pour HTTP/2.

<VirtualHost *:80>
    ServerName search.cabesto.com
    Redirect permanent / https://search.cabesto.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName search.cabesto.com
    DocumentRoot /var/www/deepfind/public
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/search.cabesto.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/search.cabesto.com/privkey.pem

    <Directory /var/www/deepfind/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Tout ce qui n'est pas un fichier existant passe par index.php (pas besoin de mod_rewrite)
        FallbackResource /index.php
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Facultatif mais conseillé : extranet accessible uniquement depuis le réseau Cabesto / VPN
    # <Location /admin>
    #     Require ip 192.0.2.0/24 198.51.100.10
    # </Location>

    # Widget : mis en cache par les navigateurs (changez ?v=N dans la balise <script> après une mise à jour)
    <Location /widget/>
        Header set Cache-Control "public, max-age=86400"
        Header set Access-Control-Allow-Origin "*"
    </Location>

    AddOutputFilterByType DEFLATE application/json text/css application/javascript text/html image/svg+xml
    Header always set Strict-Transport-Security "max-age=31536000"
    ServerSignature Off

    ErrorLog ${APACHE_LOG_DIR}/deepfind-error.log
    # Les accès API sont nombreux : journal Apache allégé (les recherches sont déjà journalisées en base)
    SetEnvIf Request_URI "^/api/v1/(search|click)" no_access_log
    CustomLog ${APACHE_LOG_DIR}/deepfind-access.log combined env=!no_access_log
</VirtualHost>
