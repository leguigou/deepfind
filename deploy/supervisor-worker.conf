; /etc/supervisor/conf.d/deepfind-worker.conf
; Traite les imports lancés depuis l'extranet. Puis : supervisorctl reread && supervisorctl update
[program:deepfind-worker]
command=/usr/bin/php8.5 /var/www/deepfind/bin/console queue:work --max-time=3600
directory=/var/www/deepfind
user=www-data
autostart=true
autorestart=true
stopwaitsecs=600
stdout_logfile=/var/log/deepfind-worker.log
stderr_logfile=/var/log/deepfind-worker.err.log
